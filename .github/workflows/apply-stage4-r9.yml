name: Apply Stage 4 R9

on:
  push:
    paths:
      - '.github/workflows/apply-stage4-r9.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract R9 and update EA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ea_path = Path('EA/EAGOLD.mq4')
          module_path = Path('Engines/EAGOLD_R9.mqh')
          panel_path = Path('UI/EAGOLD_ModularizationPanel.mqh')

          text = ea_path.read_text(encoding='utf-8')

          names = [
              'IntArrayContains',
              'IntArrayAdd',
              'R9Processed',
              'R9MarkProcessed',
              'R9SeedExistingPositions',
              'R9GetNewExposureState',
              'R9HedgeFromActivatedTicket',
              'Rule9DetectActivatedOrders',
          ]

          def find_definition(src, name):
              pattern = re.compile(r'(?m)^(?:bool|void|double|int)\\s+' + re.escape(name) + r'\\s*\\(')
              m = pattern.search(src)
              if not m:
                  raise SystemExit(f'Missing R9 definition: {name}')
              start = m.start()
              brace = src.find('{', m.end())
              if brace < 0:
                  raise SystemExit(f'Missing opening brace: {name}')
              depth = 0
              i = brace
              state = 'code'
              while i < len(src):
                  ch = src[i]
                  nxt = src[i+1] if i + 1 < len(src) else ''
                  if state == 'code':
                      if ch == '/' and nxt == '/':
                          state = 'line_comment'; i += 2; continue
                      if ch == '/' and nxt == '*':
                          state = 'block_comment'; i += 2; continue
                      if ch == '"':
                          state = 'string'; i += 1; continue
                      if ch == "'":
                          state = 'char'; i += 1; continue
                      if ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                      i += 1
                  elif state == 'line_comment':
                      if ch == '\\n': state = 'code'
                      i += 1
                  elif state == 'block_comment':
                      if ch == '*' and nxt == '/': state = 'code'; i += 2
                      else: i += 1
                  elif state == 'string':
                      if ch == '\\\\': i += 2
                      elif ch == '"': state = 'code'; i += 1
                      else: i += 1
                  else:
                      if ch == '\\\\': i += 2
                      elif ch == "'": state = 'code'; i += 1
                      else: i += 1
              raise SystemExit(f'Unclosed definition: {name}')

          extracted = {}
          ranges = []
          for name in names:
              start, end = find_definition(text, name)
              extracted[name] = text[start:end]
              ranges.append((start, end, name))

          ranges.sort(reverse=True)
          new_text = text
          for start, end, name in ranges:
              line_start = new_text.rfind('\\n', 0, start) + 1
              line_end = new_text.find('\\n', end)
              if line_end < 0: line_end = len(new_text)
              else: line_end += 1
              new_text = new_text[:line_start] + new_text[line_end:]

          marker = '// R9 helpers — unchanged business behavior.\\n'
          new_text = new_text.replace(marker, '', 1)

          include_line = '#include "../Engines/EAGOLD_R9.mqh"\\n'
          anchor = 'int RecoveryLevel(int direction){int count=CountDirectionPositions(direction);if(count<=1)return(0);return(count-1);}'
          if include_line not in new_text:
              pos = new_text.find(anchor)
              if pos < 0:
                  raise SystemExit('R9 include anchor not found')
              pos = pos + len(anchor)
              new_text = new_text[:pos] + '\\n' + include_line.rstrip('\\n') + new_text[pos:]

          module = []
          module.append('#ifndef EAGOLD_R9_MQH')
          module.append('#define EAGOLD_R9_MQH')
          module.append('')
          module.append('//==================================================================')
          module.append('// STAGE 4 — R9 EXPOSURE CONTROLLER')
          module.append('// Business behavior extracted from EAGOLD v0.106 without redesign.')
          module.append('//==================================================================')
          module.append('')
          for name in names:
              module.append(extracted[name])
              module.append('')
          module.append('#endif')
          module_path.parent.mkdir(parents=True, exist_ok=True)
          module_path.write_text('\\n'.join(module) + '\\n', encoding='utf-8')

          panel = panel_path.read_text(encoding='utf-8')
          panel = panel.replace('[DONE] 03 PERSISTENCE",4,clrYellow', '[DONE] 03 PERSISTENCE",4,clrLime')
          panel = panel.replace('[NEXT] 04 R9 EXPOSURE",5,clrSilver', '[DONE] 04 R9 EXPOSURE",5,clrLime')
          panel = panel.replace('[----] 05 R10 INTEGRATION",6,clrSilver', '[NEXT] 05 R10 INTEGRATION",6,clrYellow')
          panel = panel.replace('PROGRESS: 3 / 8  (37.5%)', 'PROGRESS: 4 / 8  (50.0%)')
          panel_path.write_text(panel, encoding='utf-8')

          # Exact-definition validation: each R9 function must live in the module and not in EA.
          mod = module_path.read_text(encoding='utf-8')
          remaining = ea_path.read_text(encoding='utf-8') if not new_text else new_text
          for name in names:
              if not re.search(r'(?m)^(?:bool|void|double|int)\\s+' + re.escape(name) + r'\\s*\\(', mod):
                  raise SystemExit(f'R9 function missing from module: {name}')
              if re.search(r'(?m)^(?:bool|void|double|int)\\s+' + re.escape(name) + r'\\s*\\(', new_text):
                  raise SystemExit(f'R9 function still defined in EA: {name}')
          if include_line not in new_text:
              raise SystemExit('R9 include missing from EA')

          ea_path.write_text(new_text, encoding='utf-8')
          print('Stage 4 R9 extraction validated.')
          PY

      - name: Commit stage 4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EA/EAGOLD.mq4 Engines/EAGOLD_R9.mqh UI/EAGOLD_ModularizationPanel.mqh
          git diff --cached --check
          git commit -m "refactor: modularize stage 4 R9 exposure"
          git push
