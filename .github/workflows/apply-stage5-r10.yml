name: Apply Stage 5 R10

on:
  push:
    paths:
      - '.github/workflows/apply-stage5-r10.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract R10 and update EA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ea = Path('EA/EAGOLD.mq4')
          mod = Path('Engines/EAGOLD_R10.mqh')
          panel = Path('UI/EAGOLD_ModularizationPanel.mqh')
          text = ea.read_text(encoding='utf-8')
          names = ['CreateR10VisualMarker','ReduceDirectionByLots','R10FindProfitFundedPair','Rule10ProfitFundedPartial','Rule10Reduce']

          def locate(src, name):
              lines = src.splitlines(True)
              offset = 0
              for idx, line in enumerate(lines):
                  stripped = line.lstrip()
                  if any(stripped.startswith(t + ' ' + name + '(') or stripped.startswith(t + ' ' + name + ' (') for t in ['bool','void','double','int']):
                      start = offset
                      brace = src.find('{', start)
                      if brace < 0: raise SystemExit('Opening brace missing: ' + name)
                      depth = 0
                      i = brace
                      quote = None
                      while i < len(src):
                          ch = src[i]
                          if quote:
                              if ch == '\\': i += 2; continue
                              if ch == quote: quote = None
                          else:
                              if ch in ['"', "'"]: quote = ch
                              elif ch == '{': depth += 1
                              elif ch == '}':
                                  depth -= 1
                                  if depth == 0: return start, i + 1
                          i += 1
                      raise SystemExit('Unclosed definition: ' + name)
                  offset += len(line)
              raise SystemExit('Missing R10 definition: ' + name)

          extracted = {}
          ranges = []
          for name in names:
              s, e = locate(text, name)
              extracted[name] = text[s:e]
              ranges.append((s,e))

          new_text = text
          for s,e in sorted(ranges, reverse=True):
              ls = new_text.rfind('\n', 0, s) + 1
              le = new_text.find('\n', e)
              if le < 0: le = len(new_text)
              else: le += 1
              new_text = new_text[:ls] + new_text[le:]

          inc = '#include "../Engines/EAGOLD_R10.mqh"\n'
          anchor = '#include "../Engines/EAGOLD_R9.mqh"\n'
          if inc not in new_text:
              p = new_text.find(anchor)
              if p < 0: raise SystemExit('R10 include anchor not found')
              new_text = new_text[:p+len(anchor)] + inc + new_text[p+len(anchor):]

          out = ['#ifndef EAGOLD_R10_MQH','#define EAGOLD_R10_MQH','', '//==================================================================','// STAGE 5 — R10 EXPOSURE REDUCTION INTEGRATION','// Business behavior extracted from EAGOLD v0.106 without redesign.','//==================================================================','']
          for name in names: out += [extracted[name], '']
          out.append('#endif')
          mod.parent.mkdir(parents=True, exist_ok=True)
          mod.write_text('\n'.join(out) + '\n', encoding='utf-8')

          ptext = panel.read_text(encoding='utf-8')
          ptext = ptext.replace('[NEXT] 05 R10 INTEGRATION",6,clrYellow','[DONE] 05 R10 INTEGRATION",6,clrLime')
          ptext = ptext.replace('[----] 06 RECOVERY",7,clrSilver','[NEXT] 06 RECOVERY",7,clrYellow')
          ptext = ptext.replace('PROGRESS: 4 / 8  (50.0%)','PROGRESS: 5 / 8  (62.5%)')
          panel.write_text(ptext, encoding='utf-8')

          for name in names:
              if (name + '(') not in mod.read_text(encoding='utf-8'): raise SystemExit('Missing in module: ' + name)
          if inc not in new_text: raise SystemExit('R10 include missing')
          ea.write_text(new_text, encoding='utf-8')
          print('Stage 5 R10 extraction validated.')
          PY
      - name: Commit stage 5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EA/EAGOLD.mq4 Engines/EAGOLD_R10.mqh UI/EAGOLD_ModularizationPanel.mqh
          git diff --cached --check
          git commit -m "refactor: modularize stage 5 R10 integration"
          git push
