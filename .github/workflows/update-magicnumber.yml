name: Update EAGOLD MagicNumber

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-magicnumber.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Change MagicNumber
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('EA/EAGOLD.mq4')
          s = p.read_text(encoding='utf-8')
          old = 'extern int MagicNumber=3001;'
          new = 'extern int MagicNumber=3009;'
          if old not in s:
              raise SystemExit('Expected MagicNumber=3001 not found')
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one occurrence, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EA/EAGOLD.mq4
          git diff --cached --check
          git commit -m 'config: change EAGOLD MagicNumber to 3009'
          git push
