name: Apply Stage 4 R9

on:
  push:
    paths:
      - '.github/workflows/apply-stage4-r9.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract R9 and update EA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ea_path = Path('EA/EAGOLD.mq4')
          module_path = Path('Engines/EAGOLD_R9.mqh')
          panel_path = Path('UI/EAGOLD_ModularizationPanel.mqh')
          text = ea_path.read_text(encoding='utf-8')

          names = [
              'IntArrayContains', 'IntArrayAdd', 'R9Processed', 'R9MarkProcessed',
              'R9SeedExistingPositions', 'R9GetNewExposureState',
              'R9HedgeFromActivatedTicket', 'Rule9DetectActivatedOrders'
          ]

          extracted = {}
          for name in names:
              pattern = re.compile(r'(?m)^((?:bool|void|double|int)[ \t]+' + re.escape(name) + r'[ \t]*\([^\n]*\n)')
              m = pattern.search(text)
              if not m:
                  raise SystemExit(f'Missing R9 definition: {name}')
              extracted[name] = m.group(1).rstrip('\n')

          new_text = text
          for name in names:
              pattern = re.compile(r'(?m)^(?:bool|void|double|int)[ \t]+' + re.escape(name) + r'[ \t]*\([^\n]*\n')
              new_text, count = pattern.subn('', new_text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not remove R9 definition: {name}')

          new_text = new_text.replace('// R9 helpers — unchanged business behavior.\n', '', 1)

          include_line = '#include "../Engines/EAGOLD_R9.mqh"\n'
          anchor = 'int RecoveryLevel(int direction){int count=CountDirectionPositions(direction);if(count<=1)return(0);return(count-1);}'
          if include_line not in new_text:
              pos = new_text.find(anchor)
              if pos < 0:
                  raise SystemExit('R9 include anchor not found')
              pos += len(anchor)
              new_text = new_text[:pos] + '\n' + include_line + new_text[pos:]

          module_lines = [
              '#ifndef EAGOLD_R9_MQH',
              '#define EAGOLD_R9_MQH',
              '',
              '//==================================================================',
              '// STAGE 4 — R9 EXPOSURE CONTROLLER',
              '// Business behavior extracted from EAGOLD v0.106 without redesign.',
              '//==================================================================',
              ''
          ]
          for name in names:
              module_lines.extend([extracted[name], ''])
          module_lines.append('#endif')
          module_path.parent.mkdir(parents=True, exist_ok=True)
          module_path.write_text('\n'.join(module_lines) + '\n', encoding='utf-8')

          panel = panel_path.read_text(encoding='utf-8')
          panel = panel.replace('[DONE] 03 PERSISTENCE",4,clrYellow', '[DONE] 03 PERSISTENCE",4,clrLime')
          panel = panel.replace('[NEXT] 04 R9 EXPOSURE",5,clrSilver', '[DONE] 04 R9 EXPOSURE",5,clrLime')
          panel = panel.replace('[----] 05 R10 INTEGRATION",6,clrSilver', '[NEXT] 05 R10 INTEGRATION",6,clrYellow')
          panel = panel.replace('PROGRESS: 3 / 8  (37.5%)', 'PROGRESS: 4 / 8  (50.0%)')
          panel_path.write_text(panel, encoding='utf-8')

          for name in names:
              definition = re.compile(r'(?m)^(?:bool|void|double|int)[ \t]+' + re.escape(name) + r'[ \t]*\(')
              if not definition.search(module_path.read_text(encoding='utf-8')):
                  raise SystemExit(f'Missing in R9 module: {name}')
              if definition.search(new_text):
                  raise SystemExit(f'Duplicate R9 definition remains in EA: {name}')
          if include_line not in new_text:
              raise SystemExit('R9 include missing from EA')

          ea_path.write_text(new_text, encoding='utf-8')
          print('Stage 4 R9 extraction validated.')
          PY

      - name: Commit stage 4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EA/EAGOLD.mq4 Engines/EAGOLD_R9.mqh UI/EAGOLD_ModularizationPanel.mqh
          git diff --cached --check
          git commit -m "refactor: modularize stage 4 R9 exposure"
          git push
